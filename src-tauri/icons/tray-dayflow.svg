<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sun" cx="0.35" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C7D2FE"/>
      <stop offset="100%" stop-color="#8EA0E1"/>
    </linearGradient>
  </defs>

  <!-- Transparent canvas for tray -->
  <rect width="256" height="256" fill="none"/>

  <!-- Sun -->
  <circle cx="112" cy="120" r="70" fill="url(#sun)"/>
  <!-- Moon crescent overlapping right side -->
  <g>
    <circle cx="150" cy="108" r="64" fill="url(#moon)"/>
    <circle cx="170" cy="108" r="64" fill="none" stroke="none"/>
    <circle cx="170" cy="108" r="60" fill="transparent"/>
    <!-- Punch a crescent by overlaying a transparent cut via mask-like overlap -->
    <circle cx="172" cy="108" r="64" fill="#000" opacity="0.0"/>
  </g>

  <!-- subtle rim highlight -->
  <circle cx="112" cy="120" r="70" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2"/>
</svg>

